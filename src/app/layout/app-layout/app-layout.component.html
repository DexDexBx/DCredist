<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
  @if (showApiProgress()) {
  <div class="fixed inset-x-0 top-0 z-[9999] h-1 overflow-hidden bg-brand-100 dark:bg-brand-500/20">
    <div class="h-full w-1/2 animate-pulse rounded-full bg-brand-600 dark:bg-brand-400"></div>
  </div>
  }

  @if (showHydrationOverlay()) {
  <div
    class="fixed inset-0 z-[9000] flex items-center justify-center bg-gray-50/80 p-4 backdrop-blur-sm dark:bg-gray-950/80"
  >
    <div
      class="flex flex-col items-center gap-3 rounded-2xl border border-gray-200 bg-white px-8 py-6 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900"
    >
      <span
        class="size-10 animate-spin rounded-full border-4 border-brand-200 border-t-brand-600 dark:border-brand-500/20 dark:border-t-brand-400"
      ></span>
      <p class="text-sm font-medium text-gray-600 dark:text-gray-300">Sincronizando datos…</p>
    </div>
  </div>
  }

  <app-sidebar />
  <app-backdrop />

  <div class="transition-[margin] duration-300 ease-in-out" [class]="sidebarService.contentOffset()">
    <app-header />

    <main class="mx-auto w-full max-w-(--breakpoint-2xl) p-3 sm:p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
