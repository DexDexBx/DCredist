<div class="flex min-h-screen bg-white dark:bg-gray-900">
  <div class="flex w-full flex-col justify-center px-6 py-10 lg:w-1/2 lg:px-12">
    <div class="mx-auto w-full max-w-md">
      <a routerLink="/" class="inline-flex items-center gap-2.5">
        <span
          class="flex size-10 items-center justify-center rounded-xl bg-brand-700 text-sm font-bold text-white"
          aria-hidden="true"
          >DC</span
        >
        <span class="text-lg font-semibold tracking-tight text-gray-900 dark:text-white/90"
          >DCredits</span
        >
      </a>

      <div class="mt-10">
        <ng-content />
      </div>
    </div>
  </div>

  <div
    class="relative hidden w-1/2 items-center justify-center overflow-hidden bg-brand-950 lg:flex"
  >
    <div
      class="pointer-events-none absolute -end-24 -top-24 size-96 rounded-full bg-brand-700/40 blur-3xl"
      aria-hidden="true"
    ></div>
    <div
      class="pointer-events-none absolute -bottom-32 -start-16 size-96 rounded-full bg-accent-400/20 blur-3xl"
      aria-hidden="true"
    ></div>

    <div class="relative z-10 max-w-sm px-8">
      <p class="text-2xl font-semibold text-white">
        Participación en eventos académicos
      </p>
      <p class="mt-3 text-sm leading-relaxed text-white/70">
        Gestiona eventos, participantes y códigos únicos de participación desde un solo
        lugar.
      </p>
    </div>
  </div>

  <button
    type="button"
    class="fixed bottom-6 end-6 z-50 inline-flex size-10 items-center justify-center rounded-xl border border-gray-200 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white"
    (click)="onToggleTheme()"
    [attr.aria-label]="themeService.isDark() ? 'Usar tema claro' : 'Usar tema oscuro'"
  >
    @if (themeService.isDark()) {
    <dc-icon name="sun" [size]="19" />
    } @else {
    <dc-icon name="moon" [size]="19" />
    }
  </button>
</div>
