<header
  class="sticky top-0 z-40 w-full border-b border-gray-200 bg-white/95 backdrop-blur dark:border-gray-800 dark:bg-gray-900/95"
>
  <div class="flex h-16 items-center gap-3 px-4 sm:px-6">
    <button
      type="button"
      class="inline-flex size-10 items-center justify-center rounded-xl border border-gray-200 text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-800 dark:border-gray-800 dark:text-gray-300 dark:hover:bg-white/5"
      (click)="onToggleSidebar()"
      aria-label="Alternar menú lateral"
    >
      @if (sidebarService.isMobileOpen()) {
      <dc-icon name="close" [size]="19" />
      } @else {
      <dc-icon name="menu" [size]="19" />
      }
    </button>

    <button
      type="button"
      class="flex items-center gap-2.5 rounded-lg text-start"
      (click)="onBrandClick()"
    >
      <span
        class="flex size-9 items-center justify-center rounded-xl bg-brand-700 text-sm font-bold text-white xl:hidden"
        aria-hidden="true"
        >DC</span
      >
      <span class="hidden xl:block">
        <span class="block text-base font-semibold leading-tight tracking-tight text-gray-900 dark:text-white/90"
          >DCredits</span
        >
        <span
          class="block text-xs leading-tight text-gray-500 dark:text-gray-400"
          >Participación en eventos académicos</span
        >
      </span>
    </button>

    @if (dataMode.source() === 'mock') {
    <span
      class="hidden rounded-full border border-amber-200 bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-700 sm:inline-block dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300"
      title="El API no respondió: se están mostrando datos de demostración."
      >Datos de demostración</span
    >
    }

    <div class="ms-auto flex items-center gap-2 sm:gap-3">
      <dc-notification-menu />

      <button
        type="button"
        class="inline-flex size-10 items-center justify-center rounded-xl border border-gray-200 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white"
        (click)="onToggleTheme()"
        [attr.aria-label]="themeService.isDark() ? 'Usar tema claro' : 'Usar tema oscuro'"
      >
        @if (themeService.isDark()) {
        <dc-icon name="sun" [size]="19" />
        } @else {
        <dc-icon name="moon" [size]="19" />
        }
      </button>

      <dc-user-menu />
    </div>
  </div>
</header>
