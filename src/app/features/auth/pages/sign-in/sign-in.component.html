<auth-page-layout>
  <a
    routerLink="/welcome"
    class="mb-6 inline-flex items-center gap-1.5 text-sm font-medium text-gray-500 transition-colors hover:text-brand-700 dark:text-gray-400 dark:hover:text-brand-300"
  >
    <dc-icon name="arrow-left" [size]="16" />
    Volver al inicio
  </a>

  <h1 class="text-2xl font-semibold tracking-tight text-gray-900 dark:text-white/90">
    Iniciar sesión
  </h1>
  <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
    Accede al panel de gestión de eventos y participación.
  </p>

  <div class="mt-8">
    <app-signin-form />
  </div>
</auth-page-layout>
