@if (isOpen()) { @if (studentId(); as sid) {
<div class="fixed inset-0 z-[99999] overflow-y-auto bg-gray-900/70 p-3 sm:p-6">
  <div class="mx-auto flex w-full max-w-3xl flex-col gap-3">
    <div
      class="dc-no-print flex items-center justify-between gap-3 rounded-2xl bg-white px-4 py-3 shadow-lg dark:bg-gray-900"
    >
      <div class="flex items-center gap-3">
        <span
          class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-300"
        >
          <dc-icon name="graduation" [size]="18" />
        </span>
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-gray-900 dark:text-white/90">
            Constancia de créditos
          </p>
          <p class="truncate text-xs text-gray-500 dark:text-gray-400">
            Vista previa de la constancia
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="print()"
          class="inline-flex items-center gap-2 rounded-xl bg-brand-600 px-3.5 py-2 text-sm font-medium text-white transition-colors hover:bg-brand-700"
        >
          <dc-icon name="download" [size]="16" />
          Imprimir
        </button>
        <button
          type="button"
          (click)="close.emit()"
          aria-label="Cerrar"
          class="flex size-9 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
        >
          <dc-icon name="close" [size]="18" />
        </button>
      </div>
    </div>

    <dc-certificate-document [studentId]="sid" />
  </div>
</div>
} }
