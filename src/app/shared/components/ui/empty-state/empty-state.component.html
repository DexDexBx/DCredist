<div
  class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-gray-300 bg-gray-50 px-6 py-12 text-center dark:border-gray-700 dark:bg-white/[0.02]"
>
  <span
    class="flex size-12 items-center justify-center rounded-full bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-300"
    aria-hidden="true"
  >
    <dc-icon name="document" [size]="24" />
  </span>

  <h3 class="mt-4 text-sm font-semibold text-gray-900 dark:text-white/90">
    {{ title() }}
  </h3>

  @if (description()) {
  <p class="mt-1 max-w-sm text-sm text-gray-500 dark:text-gray-400">
    {{ description() }}
  </p>
  }

  <div class="mt-4">
    <ng-content />
  </div>
</div>
