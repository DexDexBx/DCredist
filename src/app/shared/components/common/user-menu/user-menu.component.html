<div class="relative">
  <button
    type="button"
    class="flex items-center gap-2.5 rounded-xl border border-gray-200 py-1.5 ps-1.5 pe-3 transition-colors hover:bg-gray-100 dark:border-gray-800 dark:hover:bg-white/5"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
  >
    <span
      class="flex size-8 items-center justify-center rounded-lg bg-brand-700 text-xs font-semibold text-white"
      aria-hidden="true"
      >{{ initials() }}</span
    >
    <span class="hidden text-start sm:block">
      <span class="block text-sm font-medium leading-tight text-gray-900 dark:text-white/90">
        {{ displayName() }}
      </span>
      <span class="block text-xs leading-tight text-gray-500 dark:text-gray-400">
        {{ roleLabel() }}
      </span>
    </span>
    <dc-icon
      name="chevron-down"
      [size]="16"
      class="text-gray-400 dark:text-gray-500"
    />
  </button>

  @if (open()) {
  <div
    class="absolute end-0 z-50 mt-2 w-64 rounded-2xl border border-gray-200 bg-white p-2 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900"
  >
    <div class="flex items-start gap-3 px-3 py-2">
      <span
        class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-xs font-semibold text-brand-700 dark:bg-brand-500/15 dark:text-brand-300"
        aria-hidden="true"
        >{{ initials() }}</span
      >
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-gray-900 dark:text-white/90">
          {{ displayName() }}
        </p>
        @if (currentUser(); as user) {
        <p class="truncate text-xs text-gray-500 dark:text-gray-400">{{ user.email }}</p>
        }
        <span
          class="mt-1.5 inline-flex rounded-full bg-warning-50 px-2 py-0.5 text-[11px] font-medium text-warning-600 dark:bg-warning-500/15 dark:text-orange-400"
        >
          Sesión de demostración
        </span>
      </div>
    </div>

    <div class="my-1 h-px bg-gray-200 dark:bg-gray-800" aria-hidden="true"></div>

    @if (auth.can('users', 'MANAGE')) {
    <a
      routerLink="/users"
      (click)="close()"
      class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-white/5"
    >
      <dc-icon name="settings" [size]="17" />
      Usuarios y perfiles
    </a>
    }

    <button
      type="button"
      (click)="logout()"
      class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-error-600 transition-colors hover:bg-error-50 dark:text-error-500 dark:hover:bg-error-500/10"
    >
      <dc-icon name="logout" [size]="17" />
      Cerrar sesión
    </button>
  </div>
  }
</div>
