<div class="relative">
  <button
    type="button"
    class="relative inline-flex size-10 items-center justify-center rounded-xl border border-gray-200 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white"
    (click)="toggle()"
    aria-label="Notificaciones"
    [attr.aria-expanded]="open()"
  >
    <dc-icon name="bell" [size]="19" />
  </button>

  @if (open()) {
  <div
    class="absolute end-0 z-50 mt-2 w-72 rounded-2xl border border-gray-200 bg-white p-4 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900"
  >
    <p class="text-sm font-semibold text-gray-900 dark:text-white/90">Notificaciones</p>

    <div
      class="mt-3 flex flex-col items-center gap-1 rounded-xl border border-dashed border-gray-300 px-4 py-6 text-center dark:border-gray-700"
    >
      <dc-icon
        name="bell"
        [size]="22"
        class="text-gray-400 dark:text-gray-500"
      />
      <p class="text-sm text-gray-600 dark:text-gray-300">Sin novedades por mostrar</p>
    </div>

    <button
      type="button"
      class="mt-3 w-full rounded-lg px-3 py-2 text-xs font-medium text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
      (click)="close()"
    >
      Cerrar
    </button>
  </div>
  }
</div>
