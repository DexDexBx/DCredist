
      - name: Comprobar secretos y preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DCREDITS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DCREDITS_HOST }}
          DEPLOY_USER: ${{ secrets.DCREDITS_USER }}
        run: |
          set -eu

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::DCREDITS_SSH_KEY está vacío o no está disponible"
            exit 1
          }

          test -n "$DEPLOY_HOST" || {
            echo "::error::DCREDITS_HOST está vacío o no está disponible"
            exit 1
          }

          test -n "$DEPLOY_USER" || {
            echo "::error::DCREDITS_USER está vacío o no está disponible"
            exit 1
          }

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          echo "Los tres secretos están disponibles."
