
name: DCredits - Despliegue de pruebas

'on':
  push:
    branches:
      - feature/dcredits-v01-limpieza
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcredits-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Actualizar servidor de pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Diagnosticar conectividad SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DCREDITS_HOST }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST" || {
            echo "::error::Falta el secreto DCREDITS_HOST"
            exit 1
          }

          echo "Probando el puerto SSH 22..."
          if timeout 10 bash -c 'echo > /dev/tcp/$1/22' _ "$DEPLOY_HOST"; then
            echo "Puerto 22 accesible."
          else
            echo "::error::No se puede conectar al puerto 22 del host configurado."
            exit 1
          fi

      - name: Preparar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DCREDITS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DCREDITS_HOST }}
          DEPLOY_USER: ${{ secrets.DCREDITS_USER }}
        run: |
          set -eu

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::Falta DCREDITS_SSH_KEY"
            exit 1
          }
          test -n "$DEPLOY_USER" || {
            echo "::error::Falta DCREDITS_USER"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

          ssh-keyscan -T 10 -p 22 -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          test -s "$HOME/.ssh/known_hosts"
          echo "Preparación SSH completada."

      - name: Desplegar DCredits en pruebas
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DCREDITS_HOST }}
          DEPLOY_USER: ${{ secrets.DCREDITS_USER }}
        run: |
          set -eu

          ssh -i "$HOME/.ssh/id_ed25519" \
            -p 22 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/dcredits/test/app

          git fetch origin feature/dcredits-v01-limpieza
          git checkout feature/dcredits-v01-limpieza
          git pull --ff-only origin feature/dcredits-v01-limpieza

          docker compose --env-file .env -f compose.yaml config --quiet
          docker compose --env-file .env -f compose.yaml up -d --build --remove-orphans
          docker compose --env-file .env -f compose.yaml ps
          REMOTE
