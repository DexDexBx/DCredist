
name: DCredits - Despliegue de pruebas

'on':
  push:
    branches:
      - feature/dcredits-v01-limpieza
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcredits-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Actualizar servidor de pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Diagnosticar y preparar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DCREDITS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DCREDITS_HOST }}
          DEPLOY_USER: ${{ secrets.DCREDITS_USER }}
        run: |
          set -eu

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::Falta DCREDITS_SSH_KEY"
            exit 1
          }

          test -n "$DEPLOY_HOST" || {
            echo "::error::Falta DCREDITS_HOST"
            exit 1
          }

          test -n "$DEPLOY_USER" || {
            echo "::error::Falta DCREDITS_USER"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          if ! ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null; then
            echo "::error::La clave SSH no es válida o requiere contraseña"
            exit 1
          fi

          echo "Clave privada SSH válida."

          if ! ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
            echo "::error::No se pudo obtener la clave SSH del servidor"
            exit 1
          fi

          echo "Preparación SSH completada."

      - name: Desplegar DCredits en pruebas
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DCREDITS_HOST }}
          DEPLOY_USER: ${{ secrets.DCREDITS_USER }}
        run: |
          set -eu

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/dcredits/test/app

          git fetch origin feature/dcredits-v01-limpieza
          git checkout feature/dcredits-v01-limpieza
          git pull --ff-only origin feature/dcredits-v01-limpieza

          docker compose --env-file .env -f compose.yaml config --quiet
          docker compose --env-file .env -f compose.yaml up -d --build --remove-orphans
          docker compose --env-file .env -f compose.yaml ps
          REMOTE
